name: Update FPL data

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch latest FPL data
        run: python3 scripts/fetch_data.py --team-id 2528374 --league-id 367147

      - name: Commit and push if changed
        run: |
          git config user.name "fpl-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update FPL data"
          git push
