name: Update FPL data

on:
  schedule:
    - cron: "0 5 * * *"
    # Extra hourly runs in the evening UTC hours, since FPL price changes
    # happen around 01:30-02:30 UK time (~00:30-01:30 UTC in summer) -
    # this catches the transfer-momentum runup for Stage B8's price alerts.
    - cron: "0 18-23 * * *"
  workflow_dispatch: {}

concurrency:
  group: fpl-data-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch latest FPL data
        run: python3 scripts/fetch_data.py --league-id 367147
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.AMIRFPLBOT }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Calibrate price-change thresholds
        run: python3 scripts/calibrate_price_threshold.py

      - name: Commit and push if changed
        run: |
          git config user.name "fpl-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update FPL data"
          git pull --rebase origin main
          git push
