name: Update live gameweek data

on:
  schedule:
    # One trigger per matchday window, not a "*/5" cron - GitHub's
    # schedule cron isn't reliable at 5-minute precision in practice
    # (observed directly on this repo: runs landing hours later than
    # their cron time), so a */5 schedule mostly just meant "eventually,
    # sometime" rather than "every 5 minutes". Instead, each of these
    # single triggers starts a job that polls on its own internal
    # `sleep` timer (see the loop below) and re-chains itself via
    # workflow_dispatch if the window outlasts one job's ~5.5h runtime
    # cap - see deadline-watch.yml for the same pattern.
    - cron: "0 10 * * 6"   # Saturday window start
    - cron: "0 10 * * 0"   # Sunday window start
    - cron: "0 18 * * 1"   # Monday Night Football window start
    - cron: "0 17 * * 2-5" # midweek + Friday Night Football window start
  workflow_dispatch:
    inputs:
      budget_minutes:
        description: "Minutes to loop before re-chaining (lower this for a quick manual smoke test)"
        required: false
        default: "320"

concurrency:
  group: fpl-data-write
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Poll live data every few minutes until settled or the window closes
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.AMIRFPLBOT }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
          BUDGET_MINUTES: ${{ github.event.inputs.budget_minutes || '320' }}
        run: |
          set -e
          git config user.name "fpl-data-bot"
          git config user.email "actions@users.noreply.github.com"

          END=$(( $(date +%s) + BUDGET_MINUTES * 60 ))
          SETTLED=0

          while [ "$(date +%s)" -lt "$END" ]; do
            OUT=$(python3 scripts/fetch_live.py)
            echo "$OUT"

            if ! git diff --quiet -- data/; then
              git add data/
              git commit -m "Update live gameweek data"
              git pull --rebase origin main
              git push
            fi

            if echo "$OUT" | grep -q "fully settled already"; then
              echo "gameweek settled - stopping"
              SETTLED=1
              break
            fi

            sleep 240
          done

          # All four matchday windows this workflow covers end at 22:00
          # UTC (see the cron comment above) - once we're past that,
          # stop even if the gameweek isn't fully settled yet (e.g. a
          # midweek gameweek whose remaining fixtures are tomorrow):
          # tomorrow's own window trigger will pick it back up, and
          # re-chaining through the night would just poll a dead match
          # window for hours doing nothing.
          HOUR=$((10#$(date -u +%H)))
          if [ "$SETTLED" -eq 0 ] && [ "$HOUR" -lt 22 ]; then
            echo "time budget spent, window still open - re-chaining"
            gh workflow run update-live.yml
          else
            echo "stopping - settled=$SETTLED hour=$HOUR"
          fi
